# Chapters 3, 5, 6, 8, 10 — the Deployment: the core object of a scalable
# web service. Every field below is load-bearing; the chapter references
# point into DOCUMENTATION.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: web-course
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 3                      # Ch3: never run one replica of anything
                                   # you care about (the HPA takes over later)
  selector:
    matchLabels:
      app.kubernetes.io/name: web  # Ch3: labels+selectors ARE the wiring —
                                   # Service and PDB target the same label
  strategy:
    type: RollingUpdate
    rollingUpdate:                 # Ch8: zero-downtime deploys —
      maxSurge: 1                  #   one extra pod may come up early,
      maxUnavailable: 0            #   never dip below desired capacity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      # Ch10: spread replicas across nodes so one node failure cannot
      # take out the whole service. ScheduleAnyway = prefer, don't block
      # (a single-node kind cluster would otherwise refuse to schedule).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web

      # Ch10: how long between SIGTERM and SIGKILL. Must exceed the app's
      # drain window plus its longest in-flight request.
      terminationGracePeriodSeconds: 30

      securityContext:             # production hygiene, on by default:
        runAsNonRoot: true         # image runs as uid 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: web
          image: web-demo:1.0          # built locally, loaded into kind
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080

          # Ch7: all config injected from the objects in 01-config.yaml.
          envFrom:
            - configMapRef:
                name: web-config
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: web-secret
                  key: API_TOKEN

          # Ch5: the probe pair. Readiness gates traffic (dependency-aware,
          # fails during warmup and drain); liveness only answers "is the
          # process wedged?" — it must NOT check dependencies, or a database
          # blip restarts the whole fleet.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          # Ch6: requests = what the scheduler reserves (and what HPA
          # percentages are computed against); limits = the hard ceiling.
          # requests == what the app needs; limits protect the node.
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # Ch10: belt-and-suspenders with the app's own SIGTERM handling —
          # a short sleep lets endpoint removal propagate to every
          # kube-proxy before the process starts shutting down.
          lifecycle:
            preStop:
              sleep:
                seconds: 3
