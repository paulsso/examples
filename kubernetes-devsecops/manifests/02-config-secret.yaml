# Chapter 6/12 — configuration and secrets, the hardened way.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: devsecops
data:
  GREETING: "hello from a hardened pod"
---
# Secrets discipline, in order of importance:
#
#  1. base64 is ENCODING — anyone who can `get secret` has the value.
#     RBAC (Chapter 4) is the first line of defense: note that the
#     web-config-reader Role deliberately cannot read secrets.
#  2. Enable encryption at rest for etcd (EncryptionConfiguration) —
#     otherwise an etcd backup IS your secrets in plaintext-equivalent.
#  3. Mount secrets as FILES, not env vars (see the Deployment):
#     env vars leak — into `kubectl describe`, crash dumps, child
#     processes, and debug endpoints that print the environment.
#  4. At scale, move the source of truth out of the cluster entirely:
#     external-secrets-operator / Vault / cloud secret managers, with
#     short-lived credentials instead of long-lived ones.
apiVersion: v1
kind: Secret
metadata:
  name: web-api-token
  namespace: devsecops
type: Opaque
stringData:
  api-token: "demo-token-rotate-me"
